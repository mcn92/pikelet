# SonarQube Cloud automatic analysis (no scanner runs in CI; this file is
# read from the default branch, and its values override the UI's
# Analysis Scope > Files settings).
#
# packages/ is the shipped code and stays fully analysed, apart from
# Emscripten-generated loaders and build output.

sonar.sources=.

# Not shipped: examples (including legacy code and the built playground),
# benchmarks, dev scripts and measurement reports. Excluded rather than
# marked as tests, because the docs do not say that test files are exempt
# from security rules. test/ is excluded here because it is analysed as
# tests below, and a file cannot be both.
#
# Generated code and build output are listed on their own as well, so they
# stay out even if examples/ is analysed again later.
sonar.exclusions=examples/**,benchmarks/**,scripts/**,docs/measurements/**,test/**,examples/legacy/**,examples/one-file-search/web/playground-dist/**,packages/pikelet-wasm/dist/**,**/encoder-kernels/encoder*.mjs,**/decoder-spike/llama*.mjs,**/encoder-spike/encoder*.mjs

sonar.tests=test
