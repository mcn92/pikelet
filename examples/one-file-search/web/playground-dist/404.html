<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Pikelet Playground</title>
<!-- Cloudflare Pages serves this file, with status 404, for any path that
     matches no file. Without it Pages falls back to index.html with 200. -->
<style>
  :root {
    --ground: #f4f3ef;
    --ink: #16181a;
    --ink-dim: #5c6167;
    --accent: #0f7d70;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0d1117;
      --ink: #e6edf3;
      --ink-dim: #8b98a5;
      --accent: #39d9c4;
    }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { padding: 0 16px; max-width: 32rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p { color: var(--ink-dim); margin: 0 0 1.25rem; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There is nothing at this address. The playground lives on a single page.</p>
  <a href="/">Go to the Pikelet Playground</a>
</main>
</body>
</html>
